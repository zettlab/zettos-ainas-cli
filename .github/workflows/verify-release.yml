name: Verify signed release binaries
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing draft or published release tag to verify
        required: true
        type: string
      linux_only:
        description: Verify a draft containing only Linux candidates (not full release acceptance)
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-24.04
    # GitHub only exposes draft releases to identities with push access.
    # This job downloads bytes; it never checks out or executes candidate code.
    permissions:
      contents: write
    steps:
      - name: Download draft or published candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir candidate \
            --pattern 'znas-*.tar.gz' --pattern SHA256SUMS --pattern SHA256SUMS.sig
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 7
  native:
    needs: download
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.linux_only && '[{"os":"ubuntu-24.04","platform":"linux-x86_64"},{"os":"ubuntu-24.04-arm","platform":"linux-aarch64"}]' || '[{"os":"ubuntu-24.04","platform":"linux-x86_64"},{"os":"ubuntu-24.04-arm","platform":"linux-aarch64"},{"os":"macos-14","platform":"macos-aarch64"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-candidate
          path: candidate
      - name: Verify and execute native binary in isolated installation
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/verify_release.py --directory candidate --version "$RELEASE_VERSION" --report evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-${{ matrix.platform }}
          path: evidence.json
          if-no-files-found: error
